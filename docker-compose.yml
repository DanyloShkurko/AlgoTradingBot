services:
  db:
    image: postgres:16
    container_name: algobot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: algobot
      POSTGRES_PASSWORD: algobot
      POSTGRES_DB: algobot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algobot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
